<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سوقي</title>
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<style>
:root {
  --bg:#151515; --panel:#1d1d1d; --panel2:#242424; --line:#323232;
  --text:#f2f2f2; --muted:#9a9a9a; --yellow:#ffd429;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
button,input{font:inherit}
button{border:0;background:none;color:inherit}
.app{
  width:100%;
  max-width:960px;
  margin:auto;
  min-height:var(--tg-viewport-stable-height,100vh);
  padding-left:var(--tg-content-safe-area-inset-left,0px);
  padding-right:var(--tg-content-safe-area-inset-right,0px);
  padding-bottom:calc(78px + var(--tg-content-safe-area-inset-bottom,0px))
}
.top{
  position:sticky;top:0;z-index:20;background:#151515;
  padding:12px 20px 8px;border-bottom:1px solid #1d1d1d;
}
.profile-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.profile{display:flex;align-items:center;gap:10px;direction:ltr}
.avatar{width:44px;height:44px;border-radius:10px;object-fit:cover}
.balance{display:flex;align-items:center;gap:6px;font-size:18px}
.balance .gem{font-size:16px;color:#ffd429}
.plus{width:22px;height:22px;border-radius:50%;background:#3b3b3b;display:grid;place-items:center;color:#bbb;font-weight:bold}
.actions{display:flex;gap:9px}
.square{width:45px;height:45px;border-radius:8px;background:#262626;border:1px solid #343434;display:grid;place-items:center;font-size:22px;color:#bbb}
.banner{width:100%;height:88px;object-fit:cover;border-radius:16px;display:block;margin-bottom:14px}
.market-tabs{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tabs{display:flex;gap:0;border:1px solid #303030;border-radius:8px;overflow:hidden;direction:ltr}
.tab{height:46px;min-width:58px;padding:0 14px;color:#bbb;border-inline-end:1px solid #2f2f2f;font-size:20px;display:flex;align-items:center;justify-content:center;gap:8px}
.tab:last-child{border-inline-end:0}
.tab.active{background:#2a2a2a;color:#f0f0f0;outline:1px solid #555;border-radius:8px}
.tab .label{font-size:17px}
.cart-top{width:48px;height:48px;border-radius:8px;background:#252525;border:1px solid #343434;display:grid;place-items:center;font-size:25px;color:#aaa}
.content{padding:17px 20px 0}
.search-row{display:flex;gap:9px;direction:ltr;margin-bottom:12px}
.search{flex:1;height:49px;border-radius:8px;background:#242424;border:1px solid #343434;display:flex;align-items:center;padding:0 14px;color:#888}
.search input{width:100%;border:0;outline:0;background:transparent;color:#ddd;font-size:17px;padding-left:10px}
.feed{width:122px;height:49px;border-radius:8px;background:#292929;border:1px solid #393939;color:#bdbdbd;font-size:17px}
.filters{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;direction:ltr;margin-bottom:16px}
.filters::-webkit-scrollbar{display:none}
.filter{flex:0 0 auto;height:40px;padding:0 13px;border-radius:8px;background:#292929;border:1px solid #2e2e2e;color:#aaa;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;direction:ltr}
.card{background:#1d1d1d;border:1px solid #2c2c2c;border-radius:8px;overflow:hidden;direction:ltr}
.thumb{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#222}
.card-body{padding:10px 11px 11px}
.gift-name{font-size:16px;color:#eee;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hash{font-size:13px;color:#888;margin-bottom:10px}
.channel-name{font-size:16px;color:var(--yellow);margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.buy-row{display:flex;gap:7px}
.price{flex:1;height:39px;border-radius:7px;background:#2a2a2a;border:1px solid #353535;display:flex;align-items:center;justify-content:center;gap:6px;color:#aaa;font-size:16px}
.cart{width:42px;height:39px;border-radius:7px;background:#2a2a2a;border:1px solid #353535;display:grid;place-items:center;color:#aaa;font-size:20px}
.notice{margin:0 0 11px;background:#493716;border:1px solid #624c1c;border-radius:8px;color:#c8c1b2;padding:13px;font-size:15px;display:none}
.notice.show{display:block}
.bottom{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);
  width:min(100%,960px);height:calc(72px + var(--tg-content-safe-area-inset-bottom,0px));background:#191919;border-top:1px solid #242424;
  display:grid;grid-template-columns:repeat(5,1fr);z-index:25;padding-bottom:var(--tg-content-safe-area-inset-bottom,0px)
}
.nav{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#666;font-size:12px}
.nav.active{color:#eee}
.nav .ico{font-size:22px}
@media(max-width:640px){
  .top{padding-inline:12px}
  .content{padding-inline:12px}
  .banner{height:78px}
  .grid{gap:7px}
  .card-body{padding:8px}
  .gift-name,.channel-name{font-size:12px}
  .hash{font-size:10px}
  .price{font-size:12px;height:35px}
  .cart{width:36px;height:35px;font-size:17px}
  .search input{font-size:14px}
  .feed{width:90px;font-size:14px}
  .tab{min-width:48px;padding-inline:10px;font-size:18px}
  .tab .label{font-size:15px}
}

/* Added: live banner + Arabic active tab + wallet top-up page */
.banner{display:none!important}
.banner-wrap{position:relative;width:100%;height:88px;overflow:hidden;border-radius:16px;margin-bottom:14px;background:#222}
.banner-track{display:flex;height:100%;direction:ltr;transition:transform .62s cubic-bezier(.22,.75,.22,1);will-change:transform}
.banner-slide{min-width:100%;height:100%}
.banner-slide img{width:100%;height:100%;object-fit:cover;display:block}
.banner-dots{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);display:flex;gap:5px;direction:ltr}
.banner-dot{width:6px;height:6px;border-radius:999px;background:rgba(255,255,255,.34);transition:.25s}
.banner-dot.active{width:17px;background:#fff}
.tab .label{display:none}
.tab.active .label{display:inline}
.plus{border:0;cursor:pointer}
.wallet-page{display:none;position:fixed;inset:0;z-index:60;background:#151515;overflow:auto;padding:0 16px 30px;color:#f2f2f2}
.wallet-page.show{display:block}
.wallet-head{position:sticky;top:0;z-index:2;height:60px;background:#151515;border-bottom:1px solid #272727;display:flex;align-items:center;justify-content:space-between;margin:0 -16px 18px;padding:0 16px}
.wallet-head h2{font-size:18px;margin:0}
.wallet-back{width:40px;height:40px;border-radius:9px;background:#242424;border:1px solid #333;font-size:20px}
.wallet-card{background:#1d1d1d;border:1px solid #303030;border-radius:14px;padding:18px;margin-bottom:16px}
.wallet-card small{display:block;color:#888;margin-bottom:8px}
.wallet-balance{font-size:32px;font-weight:800;direction:ltr;text-align:right}
.wallet-title{font-size:15px;font-weight:700;margin-bottom:10px}
.wallet-amounts{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.wallet-amount{height:64px;border-radius:11px;background:#222;border:1px solid #333;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.wallet-amount.active{background:#292929;border-color:#5a5a5a}
.wallet-amount b{font-size:18px}
.wallet-custom{display:flex;gap:8px;margin-top:10px}
.wallet-custom input{flex:1;height:49px;background:#222;border:1px solid #333;border-radius:10px;color:#fff;padding:0 12px;outline:0;text-align:right}
.wallet-primary{height:49px;padding:0 18px;border-radius:10px;background:#f2f2f2;color:#151515;font-weight:800}
.wallet-note{color:#777;font-size:11px;line-height:1.7;margin-top:12px}
@media(max-width:640px){.banner-wrap{height:78px}}

</style>
</head>

<script>

const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) {
  try { tg.ready(); } catch (_) {}
  try { tg.expand(); } catch (_) {}
  try { tg.setHeaderColor("#151515"); } catch (_) {}
  try { tg.setBackgroundColor("#151515"); } catch (_) {}
  try { tg.setBottomBarColor("#191919"); } catch (_) {}

const grid = document.getElementById('grid');
const banner = document.getElementById('banner');
const searchRow = document.getElementById('searchRow');
const filters = document.getElementById('filters');
const notice = document.getElementById('notice');

function renderGifts(){
  banner.src = giftBanner;
  searchRow.style.display='flex';
  notice.classList.remove('show');
  filters.innerHTML = `
    <button class="filter">☷</button><button class="filter">NFT⌄</button>
    <button class="filter">النموذج⌄</button><button class="filter">الخلفية⌄</button>
    <button class="filter">الرمز⌄</button><button class="filter">السعر⌄</button>
    <button class="filter">قبل السوق</button><button class="filter">الحظ</button>`;
  grid.innerHTML = giftItems.map((x,i)=>`
    <article class="card">
      <img class="thumb" src="${giftThumbs[i]}">
      <div class="card-body">
        <div class="gift-name">${x[0]}</div>
        <div class="hash">${x[1]}</div>
        <div class="buy-row">
          <div class="price">◆ ${x[2]}</div>
          <button class="cart" aria-label="Add to cart">🛒</button>
        </div>
      </div>
    </article>`).join('');
}
function renderChannels(){
  banner.src = chanBanner;
  searchRow.style.display='none';
  notice.classList.add('show');
  filters.innerHTML = `<button class="filter">☷</button><button class="filter">NFT⌄</button><button class="filter">السعر⌄</button>`;
  grid.innerHTML = channelItems.map((x,i)=>`
    <article class="card">
      <img class="thumb" src="${channelThumbs[i]}">
      <div class="card-body">
        <div class="channel-name">${x[0]}</div>
        <div class="buy-row">
          <div class="cart">◈</div>
          <div class="price">◆ ${x[1]}</div>
        </div>
      </div>
    </article>`).join('');
}
document.querySelectorAll('.tab[data-mode]').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  btn.classList.add('active');
  if(btn.dataset.mode==='channels') renderChannels(); else renderGifts();
  window.scrollTo({top:0,behavior:'smooth'});
}));

// Live banner carousel
const bannerTrack = document.getElementById("bannerTrack");
const bannerDots = document.getElementById("bannerDots");
const bannerImages = [giftBanner, chanBanner, giftBanner];
bannerTrack.innerHTML = bannerImages.map(src => '<div class="banner-slide"><img src="' + src + '" alt="إعلان"></div>').join("");
let bannerIndex = 0, bannerTimer;
bannerImages.forEach((_,i) => {
  const d = document.createElement("span");
  d.className = "banner-dot" + (i === 0 ? " active" : "");
  d.addEventListener("click", () => bannerGo(i, true));
  bannerDots.appendChild(d);
});
function bannerGo(i, restart=false) {
  bannerIndex = (i + bannerImages.length) % bannerImages.length;
  bannerTrack.style.transform = "translateX(-" + (bannerIndex * 100) + "%)";
  [...bannerDots.children].forEach((d,j) => d.classList.toggle("active", j === bannerIndex));
  if (restart) bannerStart();
}
function bannerStart() {
  clearInterval(bannerTimer);
  bannerTimer = setInterval(() => bannerGo(bannerIndex + 1), 4200);
}
bannerStart();
let bannerTouchX = null;
document.getElementById("bannerCarousel").addEventListener("touchstart", e => {
  bannerTouchX = e.touches[0].clientX;
}, {passive:true});
document.getElementById("bannerCarousel").addEventListener("touchend", e => {
  if (bannerTouchX === null) return;
  const dx = e.changedTouches[0].clientX - bannerTouchX;
  if (Math.abs(dx) > 40) bannerGo(bannerIndex + (dx < 0 ? 1 : -1), true);
  bannerTouchX = null;
}, {passive:true});

// Wallet top-up page
const walletPage = document.getElementById("walletPage");
document.getElementById("topupBtn").addEventListener("click", () => {
  walletPage.classList.add("show");
  walletPage.scrollTop = 0;
});
document.getElementById("walletBack").addEventListener("click", () => {
  walletPage.classList.remove("show");
});
let walletAmount = 50;
document.getElementById("walletAmounts").addEventListener("click", e => {
  const b = e.target.closest(".wallet-amount");
  if (!b) return;
  document.querySelectorAll(".wallet-amount").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  walletAmount = Number(b.dataset.amount);
  document.getElementById("walletCustom").value = "";
});
document.getElementById("walletCustom").addEventListener("input", e => {
  const v = Number(e.target.value);
  if (v > 0) {
    walletAmount = v;
    document.querySelectorAll(".wallet-amount").forEach(x => x.classList.remove("active"));
  }
});
document.getElementById("walletContinue").addEventListener("click", () => {
  const msg = "تم اختيار تعبئة 💎 " + walletAmount + " — الدفع الفعلي غير مربوط بعد.";
  if (tg && tg.showAlert) tg.showAlert(msg); else alert(msg);
});

renderGifts();
</script>
