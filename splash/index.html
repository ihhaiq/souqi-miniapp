<!-- Signature Yellow Splash Screen View (Modular Component) -->
<div class="splash-screen signature-yellow" id="splashScreen">
  <div class="splash-center-block">
    <!-- 3D Brand Emblem -->
    <div class="splash-3d-badge">
      <div class="badge-surface">
        <span class="badge-text-en">SOUQI</span>
        <span class="badge-text-ar">سوقي</span>
      </div>
      <div class="badge-shadow"></div>
    </div>

    <!-- Black Divider Line -->
    <div class="splash-divider"></div>

    <!-- Slogan & Tagline -->
    <div class="splash-headline-group">
      <h1 class="splash-headline-en">THE BIGGEST MARKETPLACE</h1>
      <p class="splash-headline-ar">سوق الحسابات والقنوات الرقمية الموثق</p>
    </div>
  </div>

  <!-- Bottom Loading & Session Handshake Indicator -->
  <div class="splash-bottom-bar">
    <div class="splash-progress-track">
      <div class="splash-progress-bar" id="splashProgressBar"></div>
    </div>
    <div class="splash-status-wrapper">
      <span class="splash-status-dot"></span>
      <p class="splash-status-text" id="splashStatus">جاري تهيئة الجلسة...</p>
    </div>
  </div>
</div>
